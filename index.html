<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#08070d" />
  <title>Magic Concert Archive</title>
  <meta name="description" content="A floating magical library of concert memories." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <div class="stage-intro" id="stageIntro" aria-hidden="true">
    <div class="stage-beam"></div>
    <div class="curtain curtain-left"><span></span></div>
    <div class="curtain curtain-right"><span></span></div>
    <div class="curtain-seam"></div>
  </div>
  <div class="app-shell">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>
    <div class="dust" id="dust" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>Magic Concert Archive</span></div>
      <div class="top-actions">
        <div class="counter"><span id="ticketCount">0</span> memories</div>
        <button class="add-ticket-btn" id="openAddTicket">＋ Add Ticket</button>
      </div>
    </header>

    <main class="library" id="library">
      <section class="hero-copy">
        <p class="eyebrow">A PERSONAL CONCERT LIBRARY</p>
        <h1>Every ticket<br><em>keeps a little magic.</em></h1>
        <p class="intro">Chạm vào một tấm vé để mở lại ký ức.</p>
      </section>

      <div class="shelf shelf-top" aria-hidden="true"></div>
      <div class="shelf shelf-bottom" aria-hidden="true"></div>
      <div class="book-glow book-glow-a" aria-hidden="true"></div>
      <div class="book-glow book-glow-b" aria-hidden="true"></div>

      <section class="card-field" id="cardField" aria-label="Concert tickets"></section>
      <div class="hint" aria-hidden="true"><span>↖</span> move to explore</div>
    </main>
  </div>

  <div class="modal" id="ticketModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-backdrop" data-close-ticket aria-label="Đóng"></button>
    <article class="memory-panel">
      <button class="close-btn" data-close-ticket aria-label="Đóng">×</button>
      <div class="memory-image-wrap"><img id="modalImage" alt="" /><div class="image-shine"></div></div>
      <div class="memory-copy">
        <p class="eyebrow">CONCERT MEMORY</p>
        <h2 id="modalTitle"></h2>
        <p class="memory-date" id="modalDate"></p>
        <p class="memory-note" id="modalNote"></p>
        <div class="memory-tags" id="modalTags"></div>
        <div class="memory-actions">
          <button class="delete-ticket-btn" id="deleteTicketBtn" type="button">Delete Ticket</button>
          <span class="delete-status" id="deleteStatus"></span>
        </div>
      </div>
    </article>
  </div>

  <div class="modal" id="addModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <button class="modal-backdrop" data-close-add aria-label="Đóng"></button>
    <article class="add-panel">
      <button class="close-btn" data-close-add aria-label="Đóng">×</button>
      <div class="add-heading">
        <p class="eyebrow">NEW MEMORY</p>
        <h2 id="addTitle">Add a ticket</h2>
        <p>Chọn ảnh vé và nhập vài thông tin. Tấm vé mới sẽ tự xuất hiện trong thư viện.</p>
      </div>
      <form id="ticketForm" class="ticket-form">
        <label class="upload-box">
          <input id="ticketImage" type="file" accept="image/*" required />
          <span id="uploadLabel">＋ Chọn ảnh vé</span>
          <img id="imagePreview" alt="Preview" hidden />
        </label>
        <div class="form-grid">
          <label><span>Tên concert *</span><input id="ticketTitle" type="text" maxlength="120" placeholder="Ví dụ: Anh Trai Vượt Ngàn Chông Gai" required /></label>
          <label><span>Ngày</span><input id="ticketDate" type="date" /></label>
          <label class="wide"><span>Địa điểm</span><input id="ticketLocation" type="text" maxlength="120" placeholder="The Global City, HCMC" /></label>
          <label class="wide"><span>Ghi chú</span><textarea id="ticketNote" rows="3" maxlength="500" placeholder="Một chút ký ức của đêm diễn..."></textarea></label>
          <label class="wide"><span>Tags</span><input id="ticketTags" type="text" maxlength="160" placeholder="Concert, 2026, HCMC" /></label>
        </div>
        <div class="form-status" id="formStatus"></div>
        <div class="form-actions">
          <button type="button" class="ghost-btn" data-close-add>Cancel</button>
          <button type="submit" class="save-btn" id="saveTicket">Save Ticket ✦</button>
        </div>
      </form>
    </article>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
